# Quy tắc thu đổi – chuyển từ PL A2 (hiệu lực 30/09/2026) và Excel mapping.
# Token đặc biệt:
#   NL          = theo giá nguyên liệu, theo chế độ (Thu: giá mua vào; Đổi: giá bán ra)
#   NL_THU      = luôn theo giá THU VÀO (văn bản ghi "Thu theo giá NL" cho cả thu và đổi)
#   KHONG       = không thu mua / không thu lại
#   CAM_KET_HD  = theo tỷ lệ cam kết trên HĐ / chính sách trích lục theo HĐ
#   CAN_DUYET   = chỉ áp dụng khi được duyệt theo tờ trình
#   REF_*       = tra phụ lục khác, app không tự tính
# Số thập phân = tỷ lệ (0.8 = 80%).
# Ngày HĐ: "trước 05/01/2026" = to 2026-01-04; "từ 05/01/2026" = from 2026-01-05.

version: "A2-2026-09-30"
effective_from: "2026-09-30"

rules:
  # ---------------- Nhóm thanh toán 1 ----------------
  - id: G1-VANG-MIENG
    payment_group: 1
    label: "Vàng miếng, nhẫn khoen, vàng Phúc Lộc Tài, vàng Kim Bảo"
    source: "Excel mapping – nhóm 1 (Giá thu vào)"
    thu: NL_THU
    doi: NL_THU

